name: Oppdater OddsGeneratoren
on:
  push:
    branches:
      - main
  schedule:
    - cron: '07 9 * * *'
      timezone: 'Europe/Oslo'
    - cron: '17 9 * * *'
      timezone: 'Europe/Oslo'
    - cron: '37 9 * * *'
      timezone: 'Europe/Oslo'
    - cron: '17 10 * * *'
      timezone: 'Europe/Oslo'
    - cron: '17 11 * * *'
      timezone: 'Europe/Oslo'
    - cron: '17 13 * * *'
      timezone: 'Europe/Oslo'
    - cron: '17 16 * * *'
      timezone: 'Europe/Oslo'
    - cron: '17 19 * * *'
      timezone: 'Europe/Oslo'
    - cron: '07 21 * * *'
      timezone: 'Europe/Oslo'
    - cron: '07 22 * * *'
      timezone: 'Europe/Oslo'
    - cron: '07 23 * * *'
      timezone: 'Europe/Oslo'
    - cron: '*/10 11-15 * * *'
      timezone: 'Europe/Oslo'
    - cron: '*/10 16-23 * * *'
      timezone: 'Europe/Oslo'
    - cron: '*/20 0-2 * * *'
      timezone: 'Europe/Oslo'
  workflow_dispatch:
    inputs:
      mode:
        description: daily = ny utgave, results = oppdater resultater, deploy = vis lagret utgave
        type: choice
        options:
          - deploy
          - results
          - daily
          - tomorrow
        default: deploy
      force_refresh:
        description: Erstatt dagens utgave med en ny analyse med gjeldende kode
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: oddsgeneratoren-state-and-pages
  cancel-in-progress: false
  queue: max
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.mode.outputs.should_deploy == 'true' || steps.hitrate.outputs.changed == 'true' || steps.health.outputs.changed == 'true' }}
      artifact_ready: ${{ steps.artifact.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synkroniser arbeidskopien mot nyeste main
        run: |
          git fetch --quiet origin main
          git reset --hard origin/main
      - name: Kontroller at driftsoppdateringen er installert
        id: ready
        shell: bash
        run: |
          if [[ -f scripts/operations_v55.py ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Last opp og kjør installer-drift-v55.yml for å fullføre oppdateringen.'
          fi
      - name: Test modeller, resultatkontroll og kvalitet
        if: steps.ready.outputs.ready == 'true' && (github.event_name != 'schedule' || (github.event.schedule == '07 9 * * *' || github.event.schedule == '17 9 * * *' || github.event.schedule == '37 9 * * *' || github.event.schedule == '17 10 * * *' || github.event.schedule == '17 11 * * *' || github.event.schedule == '17 13 * * *' || github.event.schedule == '17 16 * * *' || github.event.schedule == '17 19 * * *'))
        run: python -m unittest discover -s tests -v
        id: tests
      - name: Test tipsvisning og datakvalitet
        if: steps.ready.outputs.ready == 'true' && (github.event_name != 'schedule' || (github.event.schedule == '07 9 * * *' || github.event.schedule == '17 9 * * *' || github.event.schedule == '37 9 * * *' || github.event.schedule == '17 10 * * *' || github.event.schedule == '17 11 * * *' || github.event.schedule == '17 13 * * *' || github.event.schedule == '17 16 * * *' || github.event.schedule == '17 19 * * *'))
        run: |
          node --check site/three-fields-v26.js
          node tests/test_tip_ui_v32.cjs
          node tests/test_tip_audit_v34.cjs
          node --check site/hitrate-v51.js
          node tests/test_hitrate_v51.cjs
          node --check site/market-radar-v39.js
          node tests/test_market_radar_v39.cjs
          node tests/test_market_radar_v41.cjs
          node --check site/visible-selection-v40.js
          node tests/test_visible_selection_v40.cjs
          node tests/test_visible_selection_v41.cjs
          node tests/test_monitor_ui_v42.cjs
          node tests/test_selection_v36.cjs
          node tests/test_tip_audit_v34.cjs

          node tests/test_operations_v55.cjs
        id: ui_tests
      - name: Velg riktig oppdatering
        id: trigger
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$EVENT" == "push" ]]; then
            # A release can opt in to exactly one new same-day analysis.
            # Ordinary code pushes continue to deploy the stored snapshot.
            if [[ -f .github/preview-once-v24 ]] && grep -qx 'PREVIEW_NEXT_DAY_ON_PUSH' .github/preview-once-v24; then
              echo 'mode=tomorrow' >> "$GITHUB_OUTPUT"
              echo 'ONE_TIME_PREVIEW: tomorrow preview requested'
            elif [[ -f .github/refresh-once-v15 ]] && grep -qx 'REFRESH_ON_NEXT_PUSH' .github/refresh-once-v15; then
              echo "mode=daily" >> "$GITHUB_OUTPUT"
              echo "refresh_on_push=true" >> "$GITHUB_OUTPUT"
              echo 'ONE_TIME_REFRESH: new match and bookmaker analysis requested'
            else
              echo "mode=deploy" >> "$GITHUB_OUTPUT"
              echo "refresh_on_push=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$EVENT" == "schedule" && ( "$SCHEDULE" == "07 9 * * *" || "$SCHEDULE" == "17 9 * * *" || "$SCHEDULE" == "37 9 * * *" || "$SCHEDULE" == "17 10 * * *" || "$SCHEDULE" == "17 11 * * *" ) ]]; then
            # A same-day 08:00 preview must not block the 09:17 fresh morning run.
            if python scripts/morning_refresh_v29.py --due; then
              echo "mode=daily" >> "$GITHUB_OUTPUT"
              echo "refresh_on_schedule=true" >> "$GITHUB_OUTPUT"
            else
              echo "mode=deploy" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$EVENT" == "schedule" && ( "$SCHEDULE" == "17 13 * * *" || "$SCHEDULE" == "17 16 * * *" || "$SCHEDULE" == "17 19 * * *" ) ]]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"
            echo "refresh_on_schedule=true" >> "$GITHUB_OUTPUT"
            if [[ "$SCHEDULE" == "17 13 * * *" || "$SCHEDULE" == "17 19 * * *" ]]; then
              echo 'low_volume=true' >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$EVENT" == "schedule" && ( "$SCHEDULE" == "07 21 * * *" || "$SCHEDULE" == "07 22 * * *" || "$SCHEDULE" == "07 23 * * *" ) ]]; then
            # Avoid the minute<=08 filter: scheduled jobs may start late.
            if python scripts/rollover_v26.py --due --broad-window; then
              echo "mode=tomorrow" >> "$GITHUB_OUTPUT"
            else
              echo "mode=results" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$EVENT" == "schedule" ]]; then
            if python scripts/rollover_v26.py --due; then
              echo "mode=tomorrow" >> "$GITHUB_OUTPUT"
            else
              echo "mode=results" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=${INPUT_MODE:-daily}" >> "$GITHUB_OUTPUT"
          fi
        if: steps.ready.outputs.ready == 'true'
      - name: Bruk privat mellomlager for form, odds og resultater
        if: steps.ready.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            .cache/form-v29.json
            .cache/odds-v55
            .cache/results-v55
          key: runtime-v55-${{ github.run_id }}
          restore-keys: |
            runtime-v55-
            form-v30-
            form-v29-
      - name: Generer nytt dagsutvalg
        if: steps.ready.outputs.ready == 'true' && (steps.trigger.outputs.mode == 'daily' || steps.trigger.outputs.mode == 'tomorrow')
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_OUTPUT_PATH: state/.candidate.json
          ODDS_SPORTS_PER_RUN: ${{ steps.trigger.outputs.low_volume == 'true' && '2' || (steps.trigger.outputs.refresh_on_push == 'true' && '9' || (steps.trigger.outputs.mode == 'tomorrow' && '2' || '4')) }}
          ODDS_EXTRA_EVENTS: ${{ steps.trigger.outputs.mode == 'tomorrow' && '0' || '1' }}
          ODDS_TARGET_DAY_OFFSET: ${{ steps.trigger.outputs.mode == 'tomorrow' && '1' || '0' }}
          API_FOOTBALL_KEY: ''
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          SHOW_LICENSED_CRESTS: ${{ vars.SHOW_LICENSED_CRESTS }}
        run: python scripts/build_data.py
        id: analysis
        continue-on-error: true
      - name: Kontroller hjørnespark, kort og målscorere
        if: steps.trigger.outputs.mode == 'daily' && steps.ready.outputs.ready == 'true' && steps.analysis.outcome == 'success'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ODDS_V14_EXTRA_EVENTS: '1'
        run: python scripts/market_scan_v14.py state/.candidate.json
        id: extra
        continue-on-error: true
      - name: Samle kildebaserte resultatprognoser
        if: steps.trigger.outputs.mode == 'daily' && steps.ready.outputs.ready == 'true' && steps.analysis.outcome == 'success'
        env:
          API_FOOTBALL_KEY: ''
        run: python scripts/score_consensus_v14.py state/.candidate.json
        id: consensus
        continue-on-error: true
      - name: Kvalifiser anbefalinger og observasjoner v2.0
        if: steps.ready.outputs.ready == 'true' && (steps.trigger.outputs.mode == 'daily' || steps.trigger.outputs.mode == 'tomorrow') && steps.analysis.outcome == 'success'
        run: python scripts/qualify_v20.py state/.candidate.json
        id: qualify
        continue-on-error: true
      - name: Behold tips og oppdater resultatstatus
        id: mode
        shell: bash
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ''
          MODE: ${{ steps.trigger.outputs.mode }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          ODDS_OUTPUT_PATH: state/.candidate.json
          FORCE_REPLACE_EDITION: ${{ ((github.event_name == 'workflow_dispatch' && inputs.mode == 'daily' && inputs.force_refresh) || steps.trigger.outputs.refresh_on_push == 'true' || steps.trigger.outputs.refresh_on_schedule == 'true') && '1' || '0' }}
        run: |
          if [[ "$MODE" == "tomorrow" ]]; then
            python scripts/tomorrow_v24.py state/.candidate.json | tee /tmp/odds-preview.txt
            if grep -q 'TOMORROW_PREVIEW_CREATED=' /tmp/odds-preview.txt; then
              echo 'should_deploy=true' >> "$GITHUB_OUTPUT"
            else
              echo 'should_deploy=false' >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$MODE" == "results" ]]; then
            # The journal reconciles both current and archived tips below.
            echo 'should_deploy=false' >> "$GITHUB_OUTPUT"
          else
            python scripts/lifecycle.py "$MODE" | tee /tmp/odds-lifecycle.txt
            echo 'should_deploy=true' >> "$GITHUB_OUTPUT"
          fi
        if: steps.ready.outputs.ready == 'true' && ((steps.trigger.outputs.mode != 'daily' && steps.trigger.outputs.mode != 'tomorrow') || (steps.analysis.outcome == 'success' && steps.qualify.outcome == 'success'))
        continue-on-error: true
      - name: Arkiver viste tips og kontroller datagrunnlag v34
        id: tip_audit
        if: always() && steps.ready.outputs.ready == 'true' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'skipped') && (steps.ui_tests.outcome == 'success' || steps.ui_tests.outcome == 'skipped') && steps.mode.outcome == 'success' && steps.trigger.outputs.mode != 'results'
        run: node scripts/capture_visible_v34.cjs
        continue-on-error: true
      - name: Oppdater treffprosent og kontroller tidligere tips
        id: hitrate
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          API_FOOTBALL_KEY: ''
        run: python scripts/hitrate_v51.py
        if: always() && steps.ready.outputs.ready == 'true' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'skipped') && (steps.ui_tests.outcome == 'success' || steps.ui_tests.outcome == 'skipped')
        continue-on-error: true
      - name: Publiser datadekning, historiske resultater og fjern gammel forhåndsanalyse
        if: always() && steps.ready.outputs.ready == 'true' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'skipped') && (steps.ui_tests.outcome == 'success' || steps.ui_tests.outcome == 'skipped')
        run: python scripts/quality_monitor_v42.py
        id: monitor
        continue-on-error: true
      - name: Publiser faktisk driftsstatus
        id: health
        if: always() && steps.ready.outputs.ready == 'true' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'skipped') && (steps.ui_tests.outcome == 'success' || steps.ui_tests.outcome == 'skipped')
        env:
          MODE: ${{ steps.trigger.outputs.mode }}
          ANALYSIS_FAILED: ${{ steps.analysis.outcome == 'failure' || steps.qualify.outcome == 'failure' || steps.mode.outcome == 'failure' || steps.tip_audit.outcome == 'failure' }}
          RESULTS_FAILED: ${{ steps.hitrate.outcome == 'failure' }}
        run: python scripts/operations_v55.py
      - name: Lagre den valgte utgaven og resultatene
        if: always() && steps.ready.outputs.ready == 'true' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'skipped') && (steps.ui_tests.outcome == 'success' || steps.ui_tests.outcome == 'skipped') && steps.health.outcome == 'success' && (steps.trigger.outputs.mode == 'daily' || steps.trigger.outputs.mode == 'tomorrow' || steps.tip_audit.outputs.changed == 'true' || steps.hitrate.outputs.changed == 'true' || steps.hitrate.outputs.journal_changed == 'true' || steps.health.outputs.changed == 'true')
        shell: bash
        env:
          MODE: ${{ steps.trigger.outputs.mode }}
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          Path('state/.candidate.json').unlink(missing_ok=True)
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- state/ site/data/today.json site/data/history.json site/data/versions.json
          if [[ -f site/data/quality-v42.json ]]; then
            git add -A -- site/data/quality-v42.json site/data/performance-v42.json
          fi
          git add -A -- site/data
          if [[ -f site/data/tip-audit-v34.json ]]; then
            git add -A -- site/data/tip-audit-v34.json
          fi
          if [[ -f site/data/tomorrow.json ]]; then
            git add -A -- site/data
          fi
          # The trigger disappears only after a successful new daily edition.
          # A failed data pull leaves the trigger available for a job re-run.
          if [[ "${MODE}" == 'daily' ]] && [[ -f .github/refresh-once-v15 ]]; then
            if grep -q '^EDITION_CREATED=' /tmp/odds-lifecycle.txt; then
              git rm -f -- .github/refresh-once-v15
            fi
          fi
          if [[ "${MODE}" == 'tomorrow' ]] && [[ -f .github/preview-once-v24 ]]; then
            if grep -q '^TOMORROW_PREVIEW_CREATED=' /tmp/odds-preview.txt; then
              git rm -f -- .github/preview-once-v24
            fi
          fi
          if ! git diff --cached --quiet; then
            git commit -m '[snapshot] Keep daily tips and their settled results'
            git push origin HEAD:main
          fi
        id: save
      - uses: actions/configure-pages@v5
        if: always() && steps.ready.outputs.ready == 'true' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'skipped') && (steps.ui_tests.outcome == 'success' || steps.ui_tests.outcome == 'skipped') && steps.health.outcome == 'success' && (steps.save.outcome == 'success' || steps.save.outcome == 'skipped') && (steps.mode.outputs.should_deploy == 'true' || steps.hitrate.outputs.changed == 'true' || steps.health.outputs.changed == 'true')
      - uses: actions/upload-pages-artifact@v4
        if: always() && steps.ready.outputs.ready == 'true' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'skipped') && (steps.ui_tests.outcome == 'success' || steps.ui_tests.outcome == 'skipped') && steps.health.outcome == 'success' && (steps.save.outcome == 'success' || steps.save.outcome == 'skipped') && (steps.mode.outputs.should_deploy == 'true' || steps.hitrate.outputs.changed == 'true' || steps.health.outputs.changed == 'true')
        with:
          path: site
        id: artifact
      - name: Marker reelle feil i kjøringen
        if: always() && steps.ready.outputs.ready == 'true' && (steps.analysis.outcome == 'failure' || steps.qualify.outcome == 'failure' || steps.mode.outcome == 'failure' || steps.tip_audit.outcome == 'failure' || steps.hitrate.outcome == 'failure' || steps.monitor.outcome == 'failure')
        run: |
          echo 'Oppdateringen feilet. Siste gyldige utgave og aktuell driftsstatus er bevart.'
          exit 1
  deploy:
    needs: build
    if: always() && needs.build.outputs.should_deploy == 'true' && needs.build.outputs.artifact_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
