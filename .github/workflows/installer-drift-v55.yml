name: Installer driftsforbedringer v55
on:
  workflow_dispatch: null
  push:
    branches:
      - main
    paths:
      - .github/workflows/installer-drift-v55.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: oddsgeneratoren-state-and-pages
  cancel-in-progress: false
  queue: max
defaults:
  run:
    shell: bash
jobs:
  install:
    runs-on: ubuntu-latest
    outputs:
      artifact_ready: ${{ steps.artifact.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hent nyeste utgave
        run: |
          git fetch --quiet origin main
          git reset --hard origin/main
      - name: Installer driftsforbedringer
        run: |
          python - <<'PYCODE'
          import base64,gzip,hashlib,json
          from pathlib import Path
          PAYLOAD = ''
          DIGEST = '72370ca7ae18ea887330f05c89ea0d69e12c774627d43f7f7ca6b4803d354280'
          EXPECTED_WORKFLOW = '6da3cdd21e6bd87eaca8e0048c994d3b091eaf8f2a5104496dfa0c0993573f1f'
          ALLOWED = ['data/verified-results-v55.json', 'scripts/build_data.py', 'scripts/edition_status_v51.py', 'scripts/hitrate_v51.py', 'scripts/lifecycle.py', 'scripts/market_scan_v14.py', 'scripts/matchday_sports_v44.py', 'scripts/odds_budget_v55.py', 'scripts/odds_first_v25.py', 'scripts/operations_v55.py', 'scripts/qualify_v20.py', 'scripts/result_cache_v55.py', 'scripts/result_sources_v51.py', 'scripts/score_consensus_v14.py', 'scripts/sportmonks_v45.py', 'site/index.html', 'site/three-fields-v26.js', 'tests/test_market_scan_v14.py', 'tests/test_operations_v55.cjs', 'tests/test_operations_v55.py']
          workflow=Path('.github/workflows/publish.yml')
          if not workflow.is_file() or hashlib.sha256(workflow.read_bytes()).hexdigest()!=EXPECTED_WORKFLOW:
              raise SystemExit('Last opp begge filene fra pakken til .github/workflows: publish.yml og installer-drift-v55.yml. Ingen kode er endret.')
          raw=gzip.decompress(base64.b64decode(PAYLOAD))
          if hashlib.sha256(raw).hexdigest()!=DIGEST:
              raise SystemExit('Oppdateringspakken er skadet. Ingen kode er endret.')
          manifest=json.loads(raw)
          if sorted(entry['path'] for entry in manifest)!=ALLOWED:
              raise SystemExit('Uventede filer i oppdateringen. Ingen kode er endret.')
          conflicts=[]
          for entry in manifest:
              path=Path(entry['path'])
              current=hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              after=hashlib.sha256(entry['content'].encode()).hexdigest()
              if current not in (entry['before'],after):
                  conflicts.append(entry['path'])
          if conflicts:
              raise SystemExit('Nyere kode beholdt. Oppdateringen er stoppet: '+', '.join(conflicts))
          for entry in manifest:
              path=Path(entry['path'])
              path.parent.mkdir(parents=True,exist_ok=True)
              temporary=path.with_name(path.name+'.v55.tmp')
              temporary.write_text(entry['content'],encoding='utf-8')
              temporary.replace(path)
          print('V55_INSTALLERT: kvotestyring, resultatkilder og driftsstatus.')
          PYCODE
      - name: Kontroller API-budsjett, resultater og historikk
        id: tests
        run: python -m unittest discover -s tests -v
      - name: Kontroller visning og glassdesign
        id: ui_tests
        run: |
          for test in tests/*.cjs; do
            node "$test"
          done
          node --check site/three-fields-v26.js
      - name: Avklar offisielle resultater og bevar opprinnelige tips
        id: migrate
        run: |
          python - <<'PYCODE'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          immutable=('id','selectionKey','category','editionDate','firstPublishedAt','publicationRevision',
                     'matchId','home','away','league','kickoff','market','label','price')
          location=Path('state/hitrate-v51.json')
          before=json.loads(location.read_text()) if location.exists() else {'records':[]}
          audit={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('state/tip-audit-v34').glob('*.json')}
          subprocess.run([sys.executable,'scripts/hitrate_v51.py','--offline'],check=True)
          after=json.loads(location.read_text())
          by_id={record['id']:record for record in after['records']}
          for old in before['records']:
              new=by_id[old['id']]
              if any(old.get(field)!=new.get(field) for field in immutable) or not set(old.get('sourceIds',[])) <= set(new.get('sourceIds',[])):
                  raise SystemExit('Historiske tips er endret. Publisering er stoppet.')
          if any(hashlib.sha256(Path(path).read_bytes()).hexdigest()!=value for path,value in audit.items()):
              raise SystemExit('Publiseringsjournal er endret. Publisering er stoppet.')
          public=json.loads(Path('site/data/hitrate-v51.json').read_text())
          print('V55_RESULTATER '+json.dumps(public['overall'],ensure_ascii=False,sort_keys=True))
          print('V55_HISTORIKK_BEVART='+str(len(before['records'])))
          PYCODE
      - name: Bruk privat mellomlager
        uses: actions/cache@v4
        with:
          path: |
            .cache/form-v29.json
            .cache/odds-v55
            .cache/results-v55
          key: runtime-v55-${{ github.run_id }}
          restore-keys: |
            runtime-v55-
            form-v30-
            form-v29-
      - name: Kontroller dagens kampdata og hovedmarkeder
        id: analysis
        continue-on-error: true
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_OUTPUT_PATH: state/.candidate.json
          ODDS_SPORTS_PER_RUN: '2'
          ODDS_EXTRA_EVENTS: '0'
          ODDS_TARGET_DAY_OFFSET: '0'
          API_FOOTBALL_KEY: ''
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          SHOW_LICENSED_CRESTS: ${{ vars.SHOW_LICENSED_CRESTS }}
        run: python scripts/build_data.py
      - name: Kontroller dagens kandidater
        id: qualify
        continue-on-error: true
        if: steps.analysis.outcome == 'success'
        run: python scripts/qualify_v20.py state/.candidate.json
      - name: Publiser gyldig utgave
        id: mode
        continue-on-error: true
        if: steps.analysis.outcome == 'success' && steps.qualify.outcome == 'success'
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          API_FOOTBALL_KEY: ''
          ODDS_OUTPUT_PATH: state/.candidate.json
          FORCE_REPLACE_EDITION: '1'
        run: python scripts/lifecycle.py daily
      - name: Arkiver viste tips
        id: tip_audit
        continue-on-error: true
        if: steps.mode.outcome == 'success'
        run: node scripts/capture_visible_v34.cjs
      - name: Kontroller historiske resultater
        id: hitrate
        continue-on-error: true
        if: always() && steps.tests.outcome == 'success' && steps.ui_tests.outcome == 'success' && steps.migrate.outcome == 'success'
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          API_FOOTBALL_KEY: ''
        run: python scripts/hitrate_v51.py
      - name: Oppdater datakvalitet
        id: monitor
        continue-on-error: true
        if: always() && steps.tests.outcome == 'success' && steps.ui_tests.outcome == 'success' && steps.migrate.outcome == 'success'
        run: python scripts/quality_monitor_v42.py
      - name: Publiser faktisk driftsstatus
        id: health
        if: always() && steps.tests.outcome == 'success' && steps.ui_tests.outcome == 'success' && steps.migrate.outcome == 'success'
        env:
          MODE: daily
          ANALYSIS_FAILED: ${{ steps.analysis.outcome == 'failure' || steps.qualify.outcome == 'failure' || steps.mode.outcome == 'failure' || steps.tip_audit.outcome == 'failure' }}
          RESULTS_FAILED: ${{ steps.hitrate.outcome == 'failure' }}
        run: python scripts/operations_v55.py
      - name: Lagre oppdateringen og resultatene
        id: save
        if: always() && steps.tests.outcome == 'success' && steps.ui_tests.outcome == 'success' && steps.migrate.outcome == 'success' && steps.health.outcome == 'success'
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          Path('state/.candidate.json').unlink(missing_ok=True)
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/verified-results-v55.json scripts/build_data.py scripts/edition_status_v51.py scripts/hitrate_v51.py scripts/lifecycle.py scripts/market_scan_v14.py scripts/matchday_sports_v44.py scripts/odds_budget_v55.py scripts/odds_first_v25.py scripts/operations_v55.py scripts/qualify_v20.py scripts/result_cache_v55.py scripts/result_sources_v51.py scripts/score_consensus_v14.py scripts/sportmonks_v45.py site/index.html site/three-fields-v26.js tests/test_market_scan_v14.py tests/test_operations_v55.cjs tests/test_operations_v55.py state/ site/data/
          if ! git diff --cached --quiet; then
            git commit -m 'Protect API credits and verify historical results v55'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        if: always() && steps.tests.outcome == 'success' && steps.ui_tests.outcome == 'success' && steps.migrate.outcome == 'success' && steps.health.outcome == 'success' && steps.save.outcome == 'success'
      - uses: actions/upload-pages-artifact@v4
        id: artifact
        if: always() && steps.tests.outcome == 'success' && steps.ui_tests.outcome == 'success' && steps.migrate.outcome == 'success' && steps.health.outcome == 'success' && steps.save.outcome == 'success'
        with:
          path: site
      - name: Marker reelle kildefeil
        if: always() && steps.tests.outcome == 'success' && steps.ui_tests.outcome == 'success' && steps.migrate.outcome == 'success' && (steps.analysis.outcome == 'failure' || steps.qualify.outcome == 'failure' || steps.mode.outcome == 'failure' || steps.tip_audit.outcome == 'failure' || steps.hitrate.outcome == 'failure' || steps.monitor.outcome == 'failure')
        run: |
          echo 'Oppdateringen er lagret, men en datakilde eller analyse feilet. Se driftsstatus.'
          exit 1
  deploy:
    needs: install
    if: always() && needs.install.outputs.artifact_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
