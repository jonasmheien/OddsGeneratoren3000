name: Installer opprydding v53

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/installer-opprydding-v53.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: oddsgeneratoren-state-and-pages
  cancel-in-progress: false
  queue: max

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hent nyeste kode og resultater
        run: |
          git fetch --quiet origin main
          git reset --hard origin/main
      - name: Installer kontrollert kode uten aa erstatte resultatloggen
        run: |
          python - <<'PYCODE'
          import base64,gzip,hashlib,json
          from pathlib import Path
          PAYLOAD = ''
          DIGEST = '8efd7b962f1f0d01e2a75cf1ce600819053cad8619a99e344929265d91efda1a'
          blob=gzip.decompress(base64.b64decode(PAYLOAD))
          if hashlib.sha256(blob).hexdigest()!=DIGEST:
              raise SystemExit('Oppdateringspakken er skadet')
          manifest=json.loads(blob)
          conflicts=[]
          for entry in manifest:
              path=Path(entry['path'])
              if path.is_absolute() or '..' in path.parts or path.parts[0] not in ('site','scripts','tests','docs'):
                  raise SystemExit('Ugyldig kodefil i oppdateringspakken')
              current=hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              after=hashlib.sha256(entry['content'].encode()).hexdigest()
              if current not in (entry['before'],after):
                  conflicts.append(entry['path'])
          if conflicts:
              raise SystemExit('Nyere kode beholdt. Oppdateringen er stoppet: '+', '.join(conflicts))
          for entry in manifest:
              path=Path(entry['path'])
              path.parent.mkdir(parents=True,exist_ok=True)
              temporary=path.with_name(path.name+'.v53.tmp')
              temporary.write_text(entry['content'],encoding='utf-8')
              temporary.replace(path)
          print('V53_INSTALLERT: '+str(len(manifest))+' kodefiler. Lagrede tips og resultater beholdes.')
          PYCODE
      - name: Test modeller, publiseringslaas og historikk
        run: python -m unittest discover -s tests -v
      - name: Test visning, filtre og analyser
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.cjs; do node "$test_file"; done
          node --check site/visible-selection-v40.js
          node --check site/three-fields-v26.js
          node --check site/hitrate-v51.js
      - name: Beregn historikk med ett tips per kamp
        run: |
          python scripts/hitrate_v51.py --offline
          python scripts/quality_monitor_v42.py
      - name: Lagre oppdateringen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PYCODE'
          import base64,gzip,json,subprocess
          import ast
          workflow=__import__('pathlib').Path('.github/workflows/installer-opprydding-v53.yml').read_text()
          payload=next(line.strip().split(' = ',1)[1] for line in workflow.splitlines() if line.strip().startswith('PAYLOAD = '))
          paths=[entry['path'] for entry in json.loads(gzip.decompress(base64.b64decode(ast.literal_eval(payload))))]
          paths += ['state/hitrate-v51.json','site/data/hitrate-v51.json','site/data/quality-v42.json','site/data/performance-v42.json']
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','add','-A','--','state','site/data'],check=True)
          PYCODE
          if ! git diff --cached --quiet; then
            git commit -m 'Lock first published match tips and simplify lounge v53'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: install
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
