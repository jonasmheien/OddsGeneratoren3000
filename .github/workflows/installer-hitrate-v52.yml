name: Installer v52 treffprosent og stabil oppdatering

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/installer-hitrate-v52.yml']

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: oddsgeneratoren-state-and-pages
  cancel-in-progress: false
  queue: max

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hent nyeste utgave
        run: |
          git fetch --quiet origin main
          git reset --hard origin/main
      - name: Kontroller opplastet publish.yml og installer kun vanlig kode
        run: |
          python - <<'PY'
          PAYLOAD = ''
          DIGEST = 'c70048dff77f4c0a0d30b70ddad844e6d63164f29eac552edd61393ca41c1f5a'
          PUBLISH_HASH = 'c6ea40c8e339944bb2095a07082c3beea2c67750051ac3a3772c7d566f094fb0'
          import base64, gzip, hashlib, json
          from pathlib import Path
          publish = Path('.github/workflows/publish.yml')
          if not publish.exists() or hashlib.sha256(publish.read_bytes()).hexdigest() != PUBLISH_HASH:
              raise SystemExit('Last opp begge filene fra v52-pakken samtidig. Filen publish.yml skal erstatte den eksisterende publish.yml.')
          blob = gzip.decompress(base64.b64decode(PAYLOAD))
          if hashlib.sha256(blob).hexdigest() != DIGEST:
              raise SystemExit('Oppdateringspakken er skadet')
          manifest = json.loads(blob)
          conflicts = []
          for entry in manifest:
              path = Path(entry['path'])
              if path.is_absolute() or '..' in path.parts or path.parts[0] == '.github':
                  raise SystemExit('Installerjobben kan ikke endre workflow-filer')
              current = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              after = hashlib.sha256(entry['content'].encode()).hexdigest()
              if current not in (entry['before'], after):
                  conflicts.append(entry['path'])
          if conflicts:
              raise SystemExit('Nyere kildekode beholdt uten overskriving: ' + ', '.join(conflicts))
          for entry in manifest:
              path = Path(entry['path'])
              path.parent.mkdir(parents=True, exist_ok=True)
              temporary = path.with_name(path.name + '.v52.tmp')
              temporary.write_text(entry['content'], encoding='utf-8')
              temporary.replace(path)
          print('V52_INSTALLERT: ' + str(len(manifest)) + ' kodefiler. Ingen workflow-filer er endret av jobben.')
          PY
      - name: Test resultatkontroll og oppdateringsfeilen
        run: python -m unittest discover -s tests -v
      - name: Test visning og filtre
        run: |
          for test_file in tests/*.cjs; do node "$test_file"; done
          node --check site/hitrate-v51.js
          node --check site/three-fields-v26.js
      - name: Deaktiver de to kopiene og den gamle installasjonen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          targets = {'.github/workflows/publish (1).yml', '.github/workflows/publish (2).yml', '.github/workflows/installer-hitrate-v51.yml'}
          payload = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/workflows?per_page=100']))
          for workflow in payload.get('workflows', []):
              if workflow.get('path') not in targets:
                  continue
              workflow_id = workflow['id']
              subprocess.run(['gh','api','--method','PUT',f'repos/{repo}/actions/workflows/{workflow_id}/disable'],check=True)
              state = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/workflows/{workflow_id}']))
              if state.get('state') != 'disabled_manually':
                  raise SystemExit('Kunne ikke bekrefte deaktivering: '+workflow['path'])
              runs = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/workflows/{workflow_id}/runs?per_page=20']))
              for run in runs.get('workflow_runs', []):
                  if run.get('status') != 'completed':
                      subprocess.run(['gh','api','--method','POST',f'repos/{repo}/actions/runs/{run["id"]}/cancel'],capture_output=True)
              print('Deaktivert: '+workflow['path'])
          PY
      - name: Opprett treffstatistikk fra viste tips og bekreftede resultater
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          API_FOOTBALL_KEY: ''
        run: |
          node scripts/capture_visible_v34.cjs
          python scripts/hitrate_v51.py
          python scripts/quality_monitor_v42.py
      - name: Lagre kode og varig statistikk uten workflow-endringer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- docs scripts tests state site/data site/index.html site/three-fields-v26.js site/hitrate-v51.js site/hitrate-v51.css
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split(chr(0))
          if any(path.startswith('.github/') for path in paths):
              raise SystemExit('Stoppet: en workflow-fil ble forsøkt lagret automatisk')
          PY
          if ! git diff --cached --quiet; then
            git commit -m 'Install category hit rates and stable updates v52'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: install
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Kontroller og start den ordinære publiseringsjobben
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=deploy
