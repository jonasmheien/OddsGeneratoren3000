name: Installer v51 treffprosent og stabil oppdatering

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/installer-hitrate-v51.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: oddsgeneratoren-state-and-pages
  cancel-in-progress: false
  queue: max

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hent nyeste utgave
        run: |
          git fetch --quiet origin main
          git reset --hard origin/main
      - name: Kontroller og installer kode uten å overskrive nyere endringer
        run: |
          python - <<'PY'
          PAYLOAD = ''
          DIGEST = 'e77b6c704c2f1b47f46c396d9f2d95c9cdaca0c93e0c137fc1a0c0c5d19fd96e'
          import base64, gzip, hashlib, json
          from pathlib import Path
          blob = gzip.decompress(base64.b64decode(PAYLOAD))
          if hashlib.sha256(blob).hexdigest() != DIGEST:
              raise SystemExit('Oppdateringspakken er skadet')
          manifest = json.loads(blob)
          conflicts = []
          for entry in manifest:
              path = Path(entry['path'])
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit('Ugyldig filsti')
              current = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              after = hashlib.sha256(entry['content'].encode()).hexdigest() if entry['content'] is not None else None
              if current not in (entry['before'], after):
                  conflicts.append(entry['path'])
          if conflicts:
              raise SystemExit('Koden er endret siden pakken ble laget. Beholdt alle filer: ' + ', '.join(conflicts))
          for entry in manifest:
              path = Path(entry['path'])
              if entry['content'] is None:
                  path.unlink(missing_ok=True)
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  temporary = path.with_name(path.name + '.v51.tmp')
                  temporary.write_text(entry['content'], encoding='utf-8')
                  temporary.replace(path)
          print('V51_INSTALLERT: ' + str(len(manifest)) + ' kodefiler kontrollert')
          PY
      - name: Test resultatkontroll og oppdateringsfeilen
        run: python -m unittest discover -s tests -v
      - name: Test visning og filtre
        run: |
          for test_file in tests/*.cjs; do node "$test_file"; done
          node --check site/hitrate-v51.js
          node --check site/three-fields-v26.js
      - name: Opprett treffstatistikk fra viste tips og bekreftede resultater
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          API_FOOTBALL_KEY: ''
        run: |
          node scripts/capture_visible_v34.cjs
          python scripts/hitrate_v51.py
          python scripts/quality_monitor_v42.py
      - name: Lagre kode og varig statistikk
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .github/workflows docs scripts tests state site/data site/index.html site/three-fields-v26.js site/hitrate-v51.js site/hitrate-v51.css
          if ! git diff --cached --quiet; then
            git commit -m 'Fix updates and add lifetime hit rate per category v51'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: install
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
