      - name: Kontroller generatoren og fjern den feilaktige Island-kampen
        run: |
          python -m unittest discover -s tests
          PYTHONPATH=scripts python - <<'CORRECT_EDITION'
          import json
          from copy import deepcopy
          from datetime import date, datetime, timezone
          from pathlib import Path

          from lifecycle import CATEGORIES, atomic_json, validate_edition
          from market_scan_v14 import enrich_existing_coverage
          from qualify_v20 import qualify
          from quality_monitor_v42 import quality_report, write_json
          from versions_v22 import publish_version_history, record_revision

          root = Path.cwd()
          active_path = root / 'state/active.json'
          public_path = root / 'site/data/today.json'
          old = json.loads((active_path if active_path.exists() else public_path).read_text())
          day = date.fromisoformat(old.get('editionDate') or old['localDate'])
          if day != date(2026, 11, 14):
              print('Kampkontrollen gjelder fremtidige utgaver. Nåværende utgave er fra', day)
              raise SystemExit(0)
          validate_edition(old)
          checked_at = datetime.now(timezone.utc)
          corrected = deepcopy(old)
          removed_fixture = next((m for m in old['matches'] if
              (m['id'], m['home'], m['away']) == ('odds:30b32c194d8c2ae2bc5a209be5df44a9', 'Austria', 'Iceland')), None)
          if removed_fixture is None:
              print('Ingen feilaktig Island-kamp i den aktive utgaven.')
              raise SystemExit(0)
          removed = {removed_fixture['id']}
          corrected['matches'] = [m for m in corrected['matches'] if m['id'] not in removed]
          for group in ('observations', 'interestingObjects'):
              corrected[group] = [p for p in corrected[group] if p['matchId'] not in removed]

          market_board = corrected.get('additionalMarkets') or {}
          for group in ('tips', 'watchlist'):
              if group in market_board:
                  market_board[group] = [p for p in market_board[group] if p['matchId'] not in removed]
          core_quotes = enrich_existing_coverage({'matches': [removed_fixture]})
          for family in market_board.get('marketFamilies', []):
              count = core_quotes[family['key']]
              family['availableQuotes'] -= count
              market_board['coverage'][family['label']] -= count
          score_predictions = corrected.get('scorePredictions')
          if score_predictions is not None:
              games = [m for m in score_predictions['games'] if m['matchId'] not in removed]
              score_predictions['games'] = games
              score_predictions['sourceForecasts'] = sum(len(m['sources']) for m in games)
              score_predictions['fixturesWithConsensus'] = sum(bool(m['consensus']) for m in games)

          for field in ('upcomingMatches', 'matchedOdds', 'withModel', 'oddsWithVerifiedForm', 'nationalWithModel'):
              corrected['coverage'][field] -= 1
          provider = corrected['dataStatus']
          provider['nationsLeagueFixtureCheck'] = {'state': 'checked', 'excluded': 1}
          provider['oddsFirstFixtures'] -= 1
          provider['oddsEventCount'] -= 1
          for field in ('upcoming', 'withOdds', 'withModel'):
              provider['coverageByLeague']['ODDS-UNL'][field] -= 1
          for field in ('upcoming', 'matchedOdds', 'withModel'):
              provider['analysisReadiness'][field] -= 1

          corrected = qualify(corrected)
          # Re-screen against the timestamps of the original quotes. Keep existing results
          # and selections where the original analysis still produces the same tip.
          for group in CATEGORIES:
              existing = {p['selectionId']: p for p in old[group]}
              corrected[group] = [existing.get(p['selectionId'], dict(p, result={'status': 'scheduled'}))
                                  for p in corrected[group]]
          corrected['fixtureCorrection'] = {
              'checkedAt': checked_at.isoformat(),
              'source': 'https://www.uefa.com/uefanationsleague/news/02a2-1fea18abbcbc-456e846509e7-1000--uefa-nations-league-all-the-league-phase-fixtures-f/',
              'excludedFixtures': [{'matchId': removed_fixture['id'], 'home': removed_fixture['home'],
                                    'away': removed_fixture['away'], 'kickoff': removed_fixture['kickoff']}],
          }
          validate_edition(corrected)
          assert not any(mid in json.dumps({k: v for k, v in corrected.items() if k != 'fixtureCorrection'}) for mid in removed)
          atomic_json(active_path, corrected)
          atomic_json(public_path, corrected)
          archived = record_revision(old, {**corrected, 'generatedAt': checked_at.isoformat()}, root)
          if archived is not None:
              revision = json.loads(archived.read_text())
              revision['note'] = 'UEFA bekrefter Østerrike mot Irland. Den feilaktige Island-kampen er trukket fra utgaven.'
              atomic_json(archived, revision)
          publish_version_history(root)
          write_json(root / 'site/data/quality-v42.json', quality_report(corrected, checked_at))
          print('Fjernet Østerrike mot Island fra den publiserte utgaven.')
          CORRECT_EDITION
          node tests/test_visible_selection_v40.cjs
          node tests/test_visible_selection_v41.cjs
          node scripts/capture_visible_v34.cjs
      - name: Lagre rettelsen
        run: |
          git add -- "scripts/build_data.py" "scripts/morning_refresh_v29.py" "scripts/odds_first_v25.py" "tests/test_international_v43.py" "tests/test_odds_coverage_v35.py" ".github/workflows/publish.yml" ".github/workflows/publish (1).yml" ".github/workflows/publish (2).yml" "scripts/nations_league_fixtures.py" "state/active.json" "state/versions" "state/tip-audit-v34" "site/data/today.json" "site/data/quality-v42.json" "site/data/versions.json" "site/data/tip-audit-v34.json"
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Verify Nations League fixtures and prioritize daily odds'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: repair
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
