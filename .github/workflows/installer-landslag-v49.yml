# Legg denne filen i .github/workflows/ på main for å installere v49.
# Denne kjøringen sjekker og tester endringen før den kan publiseres.
name: Installer motstanderjustert landslagsmodell v49

on:
  push:
    branches: [main]
    paths: ['.github/workflows/installer-landslag-v49.yml']
  workflow_dispatch:

concurrency:
  group: oddsgeneratoren-state-and-pages
  cancel-in-progress: false
  queue: max

