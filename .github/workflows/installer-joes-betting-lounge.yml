# Last opp denne filen til .github/workflows/ på main.
# GitHub tester designet i Chromium og WebKit før endringen publiseres.
name: Installer Joe's betting lounge

on:
  push:
    branches: [main]
    paths: ['.github/workflows/installer-joes-betting-lounge.yml']
  workflow_dispatch:

concurrency:
  group: oddsgeneratoren-state-and-pages
  cancel-in-progress: false
  queue: max

jobs:
  installer:
    if: github.repository == 'jonasmheien/OddsGeneratoren3000' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Klargjør designendringen (1/6)
