      - name: Test generatoren og visningen
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          python -m unittest discover -s tests -q
          for test in tests/*.cjs; do node "$test"; done
      - name: Kontroller den offentlige resultatkilden
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from datetime import datetime, timezone
          from national_form_v48 import load_history

          _, status = load_history(datetime.now(timezone.utc))
          if status.get('state') != 'ok':
              raise SystemExit(f"Resultatkilden er utilgjengelig: {status.get('state')}")
          print(f"Hentet {status['matches']} landslagsresultater. Siste dato: {status['latestResultDate']}")
          PY
      - name: Installer på main
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrer landslagsform og ranger kvalifiserte spill'
          git push origin HEAD:main
      - name: Start ny dagsanalyse
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=daily -f force_refresh=true
