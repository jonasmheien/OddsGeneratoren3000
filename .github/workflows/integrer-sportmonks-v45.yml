name: Integrer Sportmonks gratis v45

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrer-sportmonks-v45.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oddsgeneratoren-state-and-pages
  cancel-in-progress: false

jobs:
  integrer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synkroniser nyeste main
        run: |
          git fetch --quiet origin main
          git reset --hard origin/main
      - name: Lag kildefiler og integrer dataflyten
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path('scripts/sportmonks_v45.py').write_bytes(base64.b64decode(''))
          Path('tests/test_sportmonks_v45.py').write_bytes(base64.b64decode(''))
          Path('state/.sportmonks_install_v45.py').write_bytes(base64.b64decode(''))
          print('SPORTMONKS_FILES_READY=true')
          PY
          python state/.sportmonks_install_v45.py
          rm state/.sportmonks_install_v45.py
          python -m py_compile scripts/sportmonks_v45.py scripts/build_data.py scripts/lifecycle.py
          python -m unittest discover -s tests -p 'test_sportmonks_v45.py' -v
      - name: Test eksisterende generator
        run: python -m unittest discover -s tests -q
      - name: Verifiser Sportmonks gratis tilgang uten aa vise token
        shell: bash
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from scripts.sportmonks_v45 import discover

          key = (os.getenv('SPORTMONKS_API_TOKEN') or '').strip()
          if not key:
              raise SystemExit('SPORTMONKS_KEY_STATUS=missing_secret')
          print('SPORTMONKS_KEY_STATUS=present')
          now = datetime.now(timezone.utc)
          day = now.astimezone(ZoneInfo('Europe/Oslo')).date()
          fixtures, info = discover(day, now, key)
          print('SPORTMONKS_API_STATUS=' + info['state'])
          print('SPORTMONKS_VALID_MATCHES=' + str(len(fixtures)))
          print('SPORTMONKS_VERIFIED_HISTORY=' + str(info['finished']))
          print('SPORTMONKS_FREE_PLAN_FIXTURES=' + str(info['upcoming']))
          print('SPORTMONKS_PAGES=' + str(info['pages']))
          if info['state'] != 'ok' or info['finished'] < 1:
              raise SystemExit('SPORTMONKS_PROBE_FAILED: verify plan/token or fixture access. No code committed.')
          print('SPORTMONKS_PROBE_PASSED=true')
          PY
      - name: Lagre og publiser integrasjonen
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/sportmonks_v45.py tests/test_sportmonks_v45.py scripts/build_data.py scripts/odds_first_v25.py scripts/form_history_v38.py scripts/lifecycle.py .github/workflows/publish.yml
          if ! git diff --cached --quiet; then
            git commit -m 'feat: add Sportmonks free fixtures and verified form for Denmark and Scotland'
            git push origin HEAD:main
          fi
          echo 'SPORTMONKS_INTEGRATION_COMMITTED=true'
