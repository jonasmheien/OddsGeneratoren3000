name: Installer glassdesign v54

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/installer-glass-v54.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: oddsgeneratoren-state-and-pages
  cancel-in-progress: false
  queue: max

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hent nyeste utgave
        run: |
          git fetch --quiet origin main
          git reset --hard origin/main
      - name: Installer glassdesign
        run: |
          python - <<'PYCODE'
          import base64,gzip,hashlib,json
          from pathlib import Path
          PAYLOAD = ''
          DIGEST = '8e70cd9415d97275304dbc96da1717c1af8e539ee6da0f2e6502cfee307cc08e'
          blob=gzip.decompress(base64.b64decode(PAYLOAD))
          if hashlib.sha256(blob).hexdigest()!=DIGEST:
              raise SystemExit('Oppdateringspakken er skadet')
          manifest=json.loads(blob)
          if {p['path'] for p in manifest}!={'site/index.html','site/glass-v54.css'}:
              raise SystemExit('Uventede filer i designpakken')
          conflicts=[]
          for entry in manifest:
              path=Path(entry['path'])
              current=hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              after=hashlib.sha256(entry['content'].encode()).hexdigest()
              if current not in (entry['before'],after):
                  conflicts.append(entry['path'])
          if conflicts:
              raise SystemExit('Nyere designkode beholdt. Oppdateringen er stoppet: '+', '.join(conflicts))
          for entry in manifest:
              path=Path(entry['path'])
              path.parent.mkdir(parents=True,exist_ok=True)
              temporary=path.with_name(path.name+'.v54.tmp')
              temporary.write_text(entry['content'],encoding='utf-8')
              temporary.replace(path)
          print('V54_INSTALLERT: glassdesign, Swedish Gold og samme innhold.')
          PYCODE
      - name: Kontroller designfiler
        run: |
          python - <<'PYCODE'
          from html.parser import HTMLParser
          from pathlib import Path
          class Styles(HTMLParser):
              def handle_starttag(self,tag,attrs):
                  attr=dict(attrs)
                  if tag=='link' and attr.get('rel')=='stylesheet':
                      assert (Path('site')/attr['href'].split('?')[0]).is_file(),attr['href']
          html=Path('site/index.html').read_text()
          Styles().feed(html)
          assert html.count('glass-v54.css?v=54')==1
          assert 'backdrop-filter:blur(' in Path('site/glass-v54.css').read_text()
          print('PASS: glassdesign og lokale stilfiler')
          PYCODE
      - name: Kontroller innhold, historikk og analyser
        run: |
          node tests/test_monitor_ui_v42.cjs
          node tests/test_hitrate_v51.cjs
          node tests/test_analysis_compact_v33.cjs
      - name: Lagre kun designendringen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/index.html site/glass-v54.css
          if ! git diff --cached --quiet; then
            git commit -m 'Add frosted glass presentation in Swedish Gold v54'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: install
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
