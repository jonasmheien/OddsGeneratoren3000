<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090d0d">
  <meta name="description" content="Dagens tips til Jonnern: fotballanalyse, Safe Bets, High Risk og kampresultater.">
  <title>Dagens tips til Jonnern</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="header-rail">
        <div class="identity" aria-label="OddsGeneratoren3000"><div class="monogram" aria-hidden="true">OG<span>3</span></div><span class="identity-name">ODDSGENERATOR<span>3000</span></span></div>
        <button class="refresh" type="button" id="refresh-data" aria-label="Hent siste publiserte kampstatus">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.7 9a7.5 7.5 0 0 1 12.3-2L20 12M4 12l2.1 5A7.5 7.5 0 0 0 18.4 15"/></svg>
          <span>Oppdater</span>
        </button>
      </div>
      <div class="hero-content">
        <div>
          <h1>Dagens tips <span>til Jonnern</span></h1>
          <div class="edition-meta"><span id="today-date">Laster dagsutgave</span><span class="separator"></span><span id="last-updated">Henter tips</span><span class="demo-mark" id="demo-marker" hidden>DEMO</span></div>
        </div>
      </div>
    </header>

    <div id="alert" class="alert" role="status" aria-live="polite" hidden></div>

    <section id="live" class="live-section" hidden aria-labelledby="live-title">
      <div class="live-head"><span class="live-light"></span><h2 id="live-title">LIVE</h2><span class="live-count" id="live-count"></span><span id="result-updated" class="live-updated"></span></div>
      <div id="live-list" class="live-grid"></div>
    </section>

    <nav class="section-tabs" aria-label="Gå til seksjon">
      <a href="#dagens" class="tab-active">Dagens tips</a><a href="#safe">Safe Bets</a><a href="#high">High Risk</a>
    </nav>

    <section id="dagens" class="section" aria-labelledby="dagens-title">
      <div class="section-heading"><div class="heading-left"><span class="section-index">01</span><h2 id="dagens-title">Dagens tips</h2></div><span id="tips-count" class="heading-count">0</span></div>
      <div id="top-picks" class="pick-grid"><div class="empty">Henter tips ...</div></div>
    </section>

    <div class="categories">
      <section id="safe" class="section" aria-labelledby="safe-title">
        <div class="section-heading"><div class="heading-left"><span class="section-index">02</span><h2 id="safe-title">Safe Bets</h2></div><span id="safe-count" class="heading-count">0</span></div>
        <div id="safe-list" class="mini-list"><div class="empty">Henter tips ...</div></div>
      </section>
      <section id="high" class="section" aria-labelledby="high-title">
        <div class="section-heading"><div class="heading-left"><span class="section-index">03</span><h2 id="high-title">High Risk</h2></div><span id="high-count" class="heading-count">0</span></div>
        <div id="high-list" class="mini-list"><div class="empty">Henter tips ...</div></div>
      </section>
    </div>

    <footer class="footer"><div class="footer-rule"></div><span id="footer-status"></span><span id="demo-note" hidden>Illustrasjonsdata, ikke reelle spill</span></footer>
  </main>
</body>
</html>
